[project]
name = "manip-rubiks"
version = "0.1.0"
license = "Apache-2.0"
description = "Blindfolded Rubik's cube solving through tactile robotic manipulation (MuJoCo)"
readme = "README.md"
authors = [
    { name = "vctr-dng", email = "94930828+vctr-dng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "mlflow-skinny>=3.18",
    "mujoco>=4.0.1",
    "mujoco-warp>=4.0.1",
    "numpy>=2.5.4",
    "pillow>=10",
    "python-dotenv>=1.2.4",
    "stable-baselines3>=2.4",
]

[project.scripts]
manip-rubiks = "manip_rubiks:main"
manip-rubiks-m0 = "manip_rubiks.validation.m0:main"
manip-rubiks-train-grasp = "manip_rubiks.training.train_grasp:main"
manip-rubiks-train-grasp-gpu = "manip_rubiks.training.train_grasp_gpu:main"
manip-rubiks-train-grasp-sac = "manip_rubiks.training.train_grasp_sac_gpu:main"
manip-rubiks-eval-grasp = "manip_rubiks.evaluation.grasp_benchmark:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running gate checks (run with -m slow)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
